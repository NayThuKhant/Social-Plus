services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-letstweet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-letstweet}
      POSTGRES_DB: ${POSTGRES_DB:-letstweet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-letstweet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-letstweet}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-letstweet}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-letstweet}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-letstweet}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-letstweet} ${MINIO_ROOT_PASSWORD:-letstweet};
      mc mb --ignore-existing local/media;
      mc mb --ignore-existing local/avatars;
      mc mb --ignore-existing local/banners;
      mc anonymous set download local/media;
      mc anonymous set download local/avatars;
      mc anonymous set download local/banners;
      echo 'MinIO buckets created.';
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_MINIO_PUBLIC_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_URL:-http://localhost:9000}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-letstweet}:${POSTGRES_PASSWORD:-letstweet}@db:5432/${POSTGRES_DB:-letstweet}
      REDIS_URL: redis://:${REDIS_PASSWORD:-letstweet}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-letstweet}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-letstweet}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      JWT_SECRET: ${JWT_SECRET:-letstweet}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_MINIO_PUBLIC_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_URL:-http://localhost:9000}
      # Server-side LiveKit URL — uses the internal Docker network hostname
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./prisma:/app/prisma

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    # The entrypoint script copies livekit.yaml to /tmp and appends
    # rtc.node_ip from LIVEKIT_NODE_IP before starting the server.
    # This is necessary because Viper does not reliably override nested
    # config keys via environment variables.
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /etc/livekit.yaml /tmp/livekit.yaml
        if [ -n "$$LIVEKIT_NODE_IP" ]; then
          printf '  node_ip: %s\n' "$$LIVEKIT_NODE_IP" >> /tmp/livekit.yaml
        fi
        exec /livekit-server --dev --bind 0.0.0.0 --config /tmp/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@letstweet}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-letstweet}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
  minio_data:
